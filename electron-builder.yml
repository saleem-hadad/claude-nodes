# Packages the electron-vite build in out/ into macOS DMGs (arm64 + x64): `pnpm dist`.
appId: dev.saleem.claude-nodes
productName: Claude Nodes
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
# node-pty ships N-API prebuilds, so there's nothing to rebuild for Electron.
npmRebuild: false
# spawn-helper has to be a real file on disk for node-pty to exec it.
asarUnpack:
  - node_modules/node-pty/**
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  # No version in the name, so releases/latest/download/<name> links stay stable.
  artifactName: Claude-Nodes-${arch}.${ext}
  category: public.app-category.developer-tools
  # Ad-hoc signed, not notarized: users approve the first launch in Privacy & Security.
  # Hardened runtime only matters for notarization.
  identity: '-'
  hardenedRuntime: false
dmg:
  # No auto-updater, so skip the .blockmap files.
  writeUpdateInfo: false
